[package]
name = "wp-arrow"
version = "0.4.2"
edition = "2024"
description = "Apache Arrow utilities for wp-model, providing schema mapping, data conversion, and IPC support"
license = "Apache-2.0"
repository = "https://github.com/wp-labs/wp-arrow"
homepage = "https://github.com/wp-labs/wp-arrow"
readme = "README.md"
keywords = ["arrow", "ipc", "schema", "wp-model"]
categories = ["data-structures", "encoding"]

[lib]
name = "wp_arrow"

[dependencies]
arrow = { version = "60", default-features = false, features = ["ipc"] }
wp-model-core =  "0.10"
chrono = "0.4"
num-bigint = "0.4"
# 结构化字段（Obj/Array）按 JSON 文本写入 Utf8 列 —— 与 `wp-connector-utils` 的
# 值层口径一致（`Value` 实现了 Serialize）
serde_json = "1"
